[project]
name = "cloud-camera-lambda-common"
version = "0.1.0"
description = "Lambda 共通処理(処理済み位置、リース、区間ループ、KVS ヘルパー)"
requires-python = ">=3.13"
# boto3 は Lambda のランタイムに入っているので zip には同梱しない
dependencies = []

[dependency-groups]
dev = ["boto3", "moto[dynamodb]>=5", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# `import common` で読めるように lambdas/ をパスに足す
pythonpath = [".."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
