# 仮の配信元(ONVIF エミュレーターが main に入るまでの開発用)。
# FFmpeg のテストパターンを H.265(キーフレーム間隔 1 秒、VBR)で rtsp://fakecam:8554/cam1/main に流す。
logLevel: warn
rtsp: yes
rtspTransports: [tcp]
rtmp: no
hls: no
webrtc: no
srt: no
paths:
  cam1/main:
    runOnInit: >
      ffmpeg -hide_banner -loglevel warning -re
      -f lavfi -i testsrc2=size=1280x720:rate=25
      -vf "drawbox=x=0:y=0:w=iw:h=40:color=black@0.6:t=fill"
      -c:v libx265 -preset ultrafast -tune zerolatency -pix_fmt yuv420p
      -x265-params "keyint=25:min-keyint=25:scenecut=0:repeat-headers=1:bframes=0:vbv-maxrate=1500:vbv-bufsize=3000:crf=28"
      -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
