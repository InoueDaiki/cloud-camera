# KVS WebRTC の試作: エミュレーター + 既存のエッジ(kvssink で H.265 を録画)+ WebRTC master(サイドカー)。
# 既存の edge/agent には手を入れず、同じ証明書(edge/.certs/<gateway_id>/)を両方にマウントする。
#
#   mise exec -- scripts/webrtc/tmp-aws.sh up               # cc-tmp-webrtc-* を作り edge/.certs/gw-001/ に書き出す
#   docker compose -f edge/webrtc/compose.yaml up -d --build
#   mise exec -- uv run --with boto3 scripts/webrtc/serve.py   # http://127.0.0.1:8765/?camera=cam-001
#   docker compose -f edge/webrtc/compose.yaml down
#   mise exec -- scripts/webrtc/tmp-aws.sh down
#
# Raspberry Pi 4 相当の CPU で測るときは CC_EDGE_CPUS / CC_WEBRTC_CPUS(例 4 コア中の割り当て)を指定する。
name: cc-webrtc

services:
  emulator:
    build:
      context: ../../emulator
      target: base
    # 他の compose(リポジトリ直下など)と同じタグを上書きしないよう、別のタグにする。
    # CC_EMULATOR_IMAGE で別のイメージに差し替えられる(エミュレーターの改修前後の比較など)
    image: ${CC_EMULATOR_IMAGE:-cc-webrtc-emulator:dev}
    init: false
    environment:
      EMULATOR_CAMERAS: "1"
      EMULATOR_SOURCE: ${EMULATOR_SOURCE:-}
    restart: unless-stopped

  # 既存のエッジ(録画)。シャドウを使わず、ローカル設定で main(H.265)を kvssink に流す
  edge:
    build:
      context: ..
    image: cc-webrtc-edge:dev
    depends_on:
      emulator:
        condition: service_healthy
    environment:
      CC_PROJECT: cc-tmp-webrtc
      CC_GATEWAY_ID: gw-001
      CC_SINK: ${CC_SINK:-kvs}
      CC_USE_SHADOW: "false"
      CC_CONFIG_FILE: /certs/config.json
      CC_CAMERAS: '{"cam-001": {"rtsp_url": "rtsp://emulator:8554/cam1/main", "codec": "H265", "streaming": true}}'
    volumes:
      - ../.certs/${CC_GATEWAY_ID:-gw-001}:/certs:ro
    cpus: ${CC_EDGE_CPUS:-0}
    stop_grace_period: 30s
    restart: unless-stopped

  # WebRTC master(サイドカー)。視聴者がいる間だけ RTSP を読む
  webrtc:
    build:
      context: .
    image: cc-webrtc:dev
    depends_on:
      emulator:
        condition: service_healthy
    environment:
      CC_CAMERA_ID: cam-001
      CC_RTSP_URL: ${CC_WEBRTC_RTSP_URL:-rtsp://emulator:8554/cam1/sub}
      CC_WEBRTC_CODEC: ${CC_WEBRTC_CODEC:-h264}
      KVS_ICE_TRANSPORT_POLICY: ${KVS_ICE_TRANSPORT_POLICY:-all}
      CC_TIMESTAMP: ${CC_TIMESTAMP:-pts}
      AWS_KVS_LOG_LEVEL: ${AWS_KVS_LOG_LEVEL:-3}
    volumes:
      - ../.certs/${CC_GATEWAY_ID:-gw-001}:/certs:ro
    cpus: ${CC_WEBRTC_CPUS:-0}
    restart: unless-stopped
