[project]
name = "cloud-camera-cost"
version = "0.1.0"
description = "カメラ 1 台・1 か月あたりのコストを単価と実測から計算するツール"
requires-python = ">=3.13"
dependencies = ["boto3>=1.35"]

[dependency-groups]
dev = ["moto[dynamodb,s3,cloudwatch,awslambda,iot,logs,apigatewayv2]>=5", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
